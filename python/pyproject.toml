[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "gridcarbon"
version = "0.1.0"
description = "Carbon intensity of electricity grids in 45 zones across Europe, the US and Great Britain. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# DATA-LICENSE.md must reach wheel users too, not just people who read the repo:
# it carries the CC BY 4.0 terms for the values and the EIA/ENTSO-E/NESO
# non-endorsement statements. Without this it lands in the sdist only, and
# almost nobody installs from an sdist.
license-files = ["LICENSE", "DATA-LICENSE.md"]
authors = [{ name = "gupeng", email = "hello@gridcarbon.dev" }]
maintainers = [{ name = "gupeng", email = "hello@gridcarbon.dev" }]
keywords = [
    "carbon",
    "carbon-intensity",
    "co2",
    "electricity",
    "grid",
    "energy",
    "emissions",
    "sustainability",
    "green-software",
    "entsoe",
    "eia",
    "neso",
    "climate",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://gridcarbon.dev"
Documentation = "https://gridcarbon.dev"
Repository = "https://github.com/gridcarbon/clients"
Issues = "https://github.com/gridcarbon/clients/issues"
"API status" = "https://api.gridcarbon.dev/v1/health"

[tool.hatch.build.targets.wheel]
packages = ["src/gridcarbon"]

[tool.hatch.build.targets.sdist]
include = ["src/gridcarbon", "tests", "README.md", "LICENSE", "DATA-LICENSE.md", "pyproject.toml"]
